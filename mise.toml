[tasks.tangle]
description = "Tangle src/*.org to lisp/*.el"
run = '''
for f in src/*.org; do
  emacs --batch --quick --eval "(progn (require 'org) (org-babel-tangle-file \"$f\"))"
done
'''

[tasks.test]
description = "Tangle, then run the ert tests in a batch Emacs"
depends = ["tangle"]
run = "emacs --batch --quick --load test/sns-roam-test.el --funcall ert-run-tests-batch-and-exit"

[tasks.check]
description = "Fail if the committed lisp/ differs from what src/ tangles to"
depends = ["tangle"]
run = "git diff --exit-code -- lisp/"
